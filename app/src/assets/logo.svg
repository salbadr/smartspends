<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="200" fill="#FFFFFF"/>

  <defs>
    <!-- Modern Tech/Finance Gradient -->
    <linearGradient id="smartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006aff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <g transform="translate(40, 30)">
    <!-- Icon Group -->
    <g transform="translate(10, 10)">
      <!-- Budget Bars -->
      <rect x="10" y="70" width="18" height="50" rx="9" fill="#E2E8F0"/>
      <rect x="38" y="45" width="18" height="75" rx="9" fill="#E2E8F0"/>
      
      <!-- Growth / AI Spark Dynamic Bar -->
      <rect x="66" y="20" width="18" height="100" rx="9" fill="url(#smartGrad)"/>

      <!-- AI Connection Lines & Nodes -->
      <path d="M 20 60 L 47 35 L 75 15" stroke="url(#aiGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <circle cx="20" cy="60" r="5" fill="#0052FF"/>
      <circle cx="47" cy="35" r="5" fill="#7000FF"/>
      <!-- Spark / Top AI Node -->
      <circle cx="75" cy="15" r="7" fill="#38bdf8"/>
      <circle cx="75" cy="15" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Text Group -->
    <text x="135" y="82" font-family="'DM Sans', system-ui, sans-serif" font-weight="800" font-size="42" fill="#0F172A" letter-spacing="-0.5">
      Smart<tspan fill="url(#smartGrad)">Spends</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="137" y="112" font-family="'DM Sans', system-ui, sans-serif" font-weight="500" font-size="15" fill="#64748B" letter-spacing="1.5">
      AI-POWERED BUDGETING
    </text>
  </g>
</svg>
